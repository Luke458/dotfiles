# User makepkg overrides.

_makepkg_jobs="${NPROC:-$(nproc)}"

# Reuse C/C++ compilation results across repeated AUR builds.
BUILDENV=(!distcc color ccache check !sign)
export CCACHE_DIR="${CCACHE_DIR:-${HOME}/.cache/ccache}"

# Some PKGBUILDs call `cmake --build` without an explicit parallel flag.
export CMAKE_BUILD_PARALLEL_LEVEL="${CMAKE_BUILD_PARALLEL_LEVEL:-${_makepkg_jobs}}"

# Local AUR packages do not need maximum compression; zstd -3 is much faster
# than the system default -9 and keeps package sizes reasonable.
COMPRESSZST=(zstd -c -T0 -3 -)

# Keep llama.cpp-git tuning outside paru's cached AUR clone so upstream
# PKGBUILD updates do not have to rebase local edits every time.
#
# Builds against the pip-installed ROCm 10 SDK (TheRock wheels) when present,
# otherwise falls back to the system ROCm in /opt/rocm. The SDK's libamdhip64
# shares the .so.7 SONAME with system ROCm 7.x, so the install RPATH is what
# makes the packaged binaries load ROCm 10 instead of /opt/rocm.
# Update the SDK with:
#   uv pip install --python ~/.local/share/rocm10-sdk/bin/python \
#     --index-url https://stable.repo.amd.com/rocm/whl-next/ \
#     "rocm[libraries,devel,device-gfx1201]==<version>"
if [[ ${startdir:-$PWD} == */llama.cpp-git ]]; then
  _rocm10="${HOME}/.local/share/rocm10-sdk/lib/python3.12/site-packages/_rocm_sdk_devel"
  if [[ -x ${_rocm10}/lib/llvm/bin/clang ]]; then
    export HIP_PATH="${_rocm10}" ROCM_PATH="${_rocm10}" ROCM_HOME="${_rocm10}"
    export HIPCXX="${_rocm10}/lib/llvm/bin/clang"
    export CMAKE_PREFIX_PATH="${_rocm10}/lib/cmake"
    export PATH="${_rocm10}/bin:${_rocm10}/lib/llvm/bin:${PATH}"
    _rocm_rpath="-DCMAKE_INSTALL_RPATH=${_rocm10}/lib"
  else
    export HIPCXX=/opt/rocm/lib/llvm/bin/clang
    export HIP_PATH=/opt/rocm
    _rocm_rpath=""
  fi
  LDFLAGS="${LDFLAGS} -fuse-ld=mold"
  aur_llamacpp_cmakeopts="-DGGML_HIP=ON -DGPU_TARGETS=gfx1201 -DCMAKE_HIP_COMPILER=${HIPCXX} ${_rocm_rpath}"
  unset _rocm10 _rocm_rpath
fi

unset _makepkg_jobs
