# User makepkg overrides.

_makepkg_jobs="${NPROC:-$(nproc)}"

# Reuse C/C++ compilation results across repeated AUR builds.
BUILDENV=(!distcc color ccache check !sign)
export CCACHE_DIR="${CCACHE_DIR:-${HOME}/.cache/ccache}"

# Some PKGBUILDs call `cmake --build` without an explicit parallel flag.
export CMAKE_BUILD_PARALLEL_LEVEL="${CMAKE_BUILD_PARALLEL_LEVEL:-${_makepkg_jobs}}"

# Local AUR packages do not need maximum compression; zstd -3 is much faster
# than the system default -9 and keeps package sizes reasonable.
COMPRESSZST=(zstd -c -T0 -3 -)

# Keep llama.cpp-git tuning outside paru's cached AUR clone so upstream
# PKGBUILD updates do not have to rebase local edits every time.
if [[ ${startdir:-$PWD} == */llama.cpp-git ]]; then
  export HIPCXX=/opt/rocm/lib/llvm/bin/clang
  export HIP_PATH=/opt/rocm
  LDFLAGS="${LDFLAGS} -fuse-ld=mold"
  aur_llamacpp_cmakeopts="-DGGML_HIP=ON -DAMDGPU_TARGETS=gfx1201 -DGGML_HIP_ROCWMMA_FATTN=ON -DGGML_TESTS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON"
fi

unset _makepkg_jobs
