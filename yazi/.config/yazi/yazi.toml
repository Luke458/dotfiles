# yazi.toml
[opener]
edit = [
    { run = "nvim %s", block = true, desc = "Neovim", for = "unix" },
]
view-image = [
    { run = "imv-dir %s", orphan = true, desc = "imv (directory album)", for = "unix" },
]
play = [
    { run = "mpv %s", orphan = true, desc = "mpv", for = "unix" },
]
document = [
    { run = "zathura %s", orphan = true, desc = "Zathura", for = "unix" },
]
set-wallpaper = [
    { run = '''wallpaper=%s1; hyprctl monitors -j | jq -r '.[].name' | while IFS= read -r monitor; do hyprctl hyprpaper wallpaper "$monitor, $wallpaper, cover"; done''', for = "linux", desc = "Set as wallpaper" },
]
strip-metadata = [
    { run = '''printf 'Permanently remove all embedded metadata? [y/N] '; read -r answer; case "$answer" in [yY]) exiftool -all= -overwrite_original -P %s ;; *) printf 'Cancelled.\n' ;; esac; printf 'Press Enter to return to Yazi...'; read -r''', block = true, for = "unix", desc = "Strip all metadata (ExifTool)" },
]
localsend = [
    { run = "localsend %s", orphan = true, desc = "Send via LocalSend", for = "linux" },
]

[open]
prepend_rules = [
    # Re-declared from the defaults so LocalSend shows up in Open with.
    { mime = "folder/*", use = [ "edit", "open", "reveal", "localsend" ] },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal", "localsend" ] },

    # Text-like formats do not all report a text/* MIME type.
    { mime = "text/*", use = [ "edit", "reveal", "localsend" ] },
    { mime = "application/{json,ndjson,javascript,x-javascript,xml,yaml,x-yaml,toml,x-shellscript,x-sh,wine-extension-ini}", use = [ "edit", "reveal", "localsend" ] },
    { mime = "inode/empty", use = [ "edit", "reveal", "localsend" ] },

    # Put the normal viewer first; the wallpaper action remains in Open with.
    { mime = "image/*", use = [ "view-image", "set-wallpaper", "strip-metadata", "reveal", "localsend" ] },
    { mime = "{audio,video}/*", use = [ "play", "reveal", "localsend" ] },

    # Formats supported by the installed zathura-pdf-mupdf plugin.
    { mime = "application/{pdf,oxps,epub+zip,x-fictionbook,x-mobipocket-ebook}", use = [ "document", "reveal", "localsend" ] },
]
# Wildcard append rules replace the default fallback.
append_rules = [
    { url = "*", use = [ "open", "reveal", "localsend" ] },
]
[plugin]
prepend_preloaders = [
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}", run = "mediainfo" },
    { url = "*.{ai,eps,ait}", run = "mediainfo" },
    { url = "*.md",     run = 'faster-piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dracula -- "$1"' },
]

prepend_previewers = [
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/{subrip,postscript,illustrator,dvb.ait,vnd.adobe.illustrator,eps}", run = "mediainfo" },
    { url = "*.{ai,eps,ait}", run = "mediainfo" },
    { url = "*.md",     run = 'faster-piper --rely-on-preloader' },

]

# For a large file like Adobe Illustrator, Adobe Photoshop, etc
# you may need to increase the memory limit if no image is rendered.
# https://yazi-rs.github.io/docs/configuration/yazi#tasks
#[tasks]
#  image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB
