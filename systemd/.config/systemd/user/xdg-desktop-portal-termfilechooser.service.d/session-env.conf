# Don't let the backend start before the Wayland session environment exists.
#
# This unit is D-Bus activated, and at login it was being activated ~7s before
# Hyprland started (xdg-desktop-portal gets poked early in the session), so the
# daemon captured an environment with no WAYLAND_DISPLAY and no DISPLAY.
# The daemon then execs yazi-wrapper.sh -> kitty with that stale environment,
# and kitty dies with "X11: The DISPLAY environment variable is missing /
# GLFW initialization failed", so every file chooser request fails with
# EPERM ("Backend call failed: Operation not permitted").
#
# uwsm only imports WAYLAND_DISPLAY/DISPLAY into the systemd user manager once
# the compositor is up. Gating on WAYLAND_DISPLAY (same guard the upstream
# xdg-desktop-portal-hyprland unit uses) makes systemd skip the early
# activation; it is then activated on demand, with the correct environment.
[Unit]
ConditionEnvironment=WAYLAND_DISPLAY
