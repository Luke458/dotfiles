# Don't let the portal frontend start before the Wayland session environment
# exists.
#
# At login a client on the session bus asks for org.freedesktop.portal.Desktop
# ~1s after the bus comes up, i.e. ~7s before Hyprland starts and before uwsm
# has imported WAYLAND_DISPLAY/DISPLAY into the systemd user manager. Starting
# the frontend then cascades into starting every backend with that display-less
# environment: xdg-desktop-portal-gtk crash-looped 6x ("cannot open display:")
# until it hit its start limit, xdg-desktop-portal-hyprland was skipped by its
# own ConditionEnvironment=WAYLAND_DISPLAY, and
# xdg-desktop-portal-termfilechooser started "fine" but kept a stale env
# forever (every file chooser then died with "GLFW initialization failed").
#
# Gating the frontend on WAYLAND_DISPLAY stops the cascade: the pre-session
# client's request fails (as it effectively did before, since no display-backed
# backend could serve it), and the frontend plus whichever backends are needed
# are D-Bus activated on demand once the session is up, with the correct
# environment. The backends are still individually activatable
# (xdg-desktop-portal.Documents has its own .service file), so nothing that does
# not need a display loses access.
[Unit]
ConditionEnvironment=WAYLAND_DISPLAY
